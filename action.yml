name: Datadog Apps Deploy
description: Build and deploy Vite apps to Datadog
author: Datadog

# Add your action's branding here. This will appear on the GitHub Marketplace.
branding:
  icon: upload-cloud
  color: purple

# Define your inputs here.
inputs:
  datadog-api-key:
    description: Datadog API key
    required: true
  datadog-app-key:
    description: Datadog App key
    required: true
  app-directory:
    description: Root directory of the app
    required: false
    default: '.'
  install-command:
    description: Command to install dependencies before deploying
    required: false
    default: npm ci
  datadog-site:
    description: >-
      Datadog site to deploy to (for example, datadoghq.eu). When not set, the
      CLI resolves the site from the DD_SITE or DATADOG_SITE environment
      variable, or the datadogSite field of the app's datadog-app.config.json.
    required: false
    default: ''
  cli-version:
    description: >-
      Version of @datadog/apps-cli to install. Ignored when the app's
      package.json already lists @datadog/apps-cli as a dependency; that version
      runs instead, through npx.
    required: false
    default: latest
runs:
  using: node24
  main: dist/index.js
